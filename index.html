<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jantar Mantar Chalo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Hind:wght@500;700&display=swap">
<style>
/* Layout: full-screen canvas game over a street map of Connaught Place to Jantar Mantar; cream chunky HUD chips; cream placard cards for menus. Single deliberate look. */
:root {
  --olive: #5b6b2e; --olive-deep: #3e4a1d; --ink: #262d12;
  --cream: #f6efd9; --cream-2: #ece2c2; --brown: #8a5a2b; --mustard: #e3b23c; --red: #b5432d; --go: #6f9a2a;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Hind", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body { background: var(--ink); color: var(--ink); font: 500 16px/1.45 var(--body); overflow: hidden; -webkit-user-select: none; user-select: none }
#app { position: fixed; inset: 0 }
canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none }
.hud {
  position: absolute; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.chip {
  background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; padding: 5px 12px;
  font: 700 15px/1.2 var(--body); box-shadow: 3px 3px 0 var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip.status { background: var(--olive-deep); color: var(--cream); white-space: normal; min-width: 0 }
.chip.status.hot { background: var(--mustard); color: var(--ink) }
.chip.status.alarm { background: var(--red); color: var(--cream) }
.stam { display: flex; align-items: center; gap: 8px }
.stam span { width: 70px; height: 10px; border: 2px solid var(--ink); border-radius: 99px; background: var(--cream-2); overflow: hidden }
.stam i { display: block; height: 100%; background: var(--go); width: 100% }
.spacer { flex: 1 }
.ibtn { pointer-events: auto; cursor: pointer; font: 700 13px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink) }
.ibtn:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--ink) }
:focus-visible { outline: 3px solid var(--mustard); outline-offset: 3px }

.touch {
  position: absolute; display: flex; gap: 12px; align-items: flex-end;
  right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
}
.tbtn {
  width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  font: 400 14px/1 var(--display); background: var(--mustard); color: var(--ink); touch-action: none; padding: 0;
}
.tbtn.big { width: 90px; height: 90px; font-size: 16px }
.tbtn.alt { background: var(--cream) }
.tbtn:active, .tbtn.on { transform: translate(4px,4px); box-shadow: 0 0 0 var(--ink) }

.screen {
  position: absolute; inset: 0; display: grid; place-items: center; background: rgba(38,45,18,.55); overflow: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
}
.card {
  background: var(--cream); border: 4px solid var(--ink); border-radius: 18px; box-shadow: 8px 8px 0 var(--ink);
  width: 100%; max-width: 620px; padding: clamp(18px, 4vw, 28px); display: grid; gap: 14px;
}
.card h1 {
  margin: 0; font: 400 clamp(32px, 7.5vw, 52px)/.95 var(--display); color: var(--olive); text-wrap: balance;
  text-shadow: 3px 3px 0 var(--ink);
}
.card h1 em { font-style: normal; color: var(--mustard); display: inline-block; transform: rotate(-3deg) }
.card h3 { margin: 0; font: 400 17px/1.1 var(--display); color: var(--brown) }
.card p { margin: 0 }
.tag { font-weight: 700; color: var(--brown) }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px }
.mode { border: 3px solid var(--ink); border-radius: 14px; padding: 12px; display: grid; gap: 8px; align-content: start; background: #fff9e8; min-width: 0 }
.mode.p { background: #efe2c4 }
.keys { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font-size: 14px; line-height: 1.35 }
kbd { font: 700 11px/1 var(--body); background: #fff9e8; border: 2px solid var(--ink); border-bottom-width: 3px; border-radius: 5px; padding: 2px 5px; white-space: nowrap }
.btn {
  justify-self: start; cursor: pointer; font: 400 18px/1 var(--display); padding: 14px 22px; border-radius: 999px;
  border: 3px solid var(--ink); background: var(--mustard); color: var(--ink); box-shadow: 4px 4px 0 var(--ink);
}
.btn:active { transform: translate(4px,4px); box-shadow: 0 0 0 var(--ink) }
.btn.alt { background: var(--cream-2); color: var(--brown); font-size: 15px; padding: 11px 18px }
.btn.cop { background: var(--brown); color: var(--cream) }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center }
.fine { font-size: 13px; color: #6b6146 }
@media (max-width: 560px) { .modes { grid-template-columns: minmax(0,1fr) } .stam span { width: 46px } }
</style>
</head>
<body>

<div id="app">
  <canvas id="cv" tabindex="0" aria-label="Jantar Mantar Chalo game field"></canvas>
  <div class="hud">
    <span class="chip" id="hRound">Round 1</span>
    <span class="chip" id="hKafila">Kafila 0/6</span>
    <span class="chip" id="hThird">Chances ●●●</span>
    <span class="chip stam">Dum <span><i id="hStam"></i></span></span>
    <span class="chip status" id="hStatus">Recruit marchers</span>
    <span class="spacer"></span>
    <button class="chip ibtn" id="bSound" type="button">Sound on</button>
    <button class="chip ibtn" id="bPause" type="button">Pause</button>
  </div>
  <div class="touch" id="touch" hidden>
    <button class="tbtn alt" id="bSprint" type="button">BHAGO</button>
    <button class="tbtn alt" id="bB" type="button" hidden>ROKO</button>
    <button class="tbtn big" id="bA" type="button">NARA!</button>
  </div>
  <div class="screen" id="screen"><div class="card" id="card"></div></div>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2, INK = '#262d12', CREAM = '#f6efd9';
const W = 2400, H = 1900;
const $ = id => document.getElementById(id);
const cv = $('cv'), c = cv.getContext('2d');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const inRect = (p, r, m = 0) => p.x > r.x - m && p.x < r.x + r.w + m && p.y > r.y - m && p.y < r.y + r.h + m;
const store = { get(k) { try { return localStorage.getItem('jmc_' + k) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem('jmc_' + k, v) } catch (e) {} } };

// ---------- map: Connaught Place (north) down to Jantar Mantar on Sansad Marg ----------
const CPc = { x: 1250, y: 330 }, CP_IN = 150, CP_OUT = 300;
const cpPt = (deg, r = CP_OUT) => [CPc.x + r * Math.cos(deg * Math.PI / 180), CPc.y + r * Math.sin(deg * Math.PI / 180)];
const ROADS = [
  { name: 'SANSAD MARG', w: 64, pts: [cpPt(100), [1080, 1900]] },
  { name: 'JANPATH', w: 60, pts: [cpPt(75), [1560, 1900]] },
  { name: 'BABA KHARAK SINGH MARG', w: 56, pts: [cpPt(125), [150, 1350]] },
  { name: 'KASTURBA GANDHI MARG', w: 56, pts: [cpPt(55), [2250, 1900]] },
  { name: 'BARAKHAMBA ROAD', w: 50, pts: [cpPt(15), [2400, 560]] },
  { name: 'MINTO ROAD', w: 50, pts: [cpPt(200), [0, 180]] },
  { name: 'TOLSTOY MARG', w: 46, pts: [[1165, 980], [1388, 950], [1637, 920], [2400, 880]] },
  { name: 'JANTAR MANTAR ROAD', w: 96, pts: [[1150, 1290], [520, 1290], [180, 1430]] },
  { name: 'ASHOKA ROAD', w: 56, pts: [[0, 1760], [1108, 1600], [1524, 1700], [2400, 1840]] }
];
const SEGS = [];
ROADS.forEach(r => { for (let i = 0; i < r.pts.length - 1; i++) SEGS.push({ a: r.pts[i], b: r.pts[i + 1], w: r.w, r }) });
[100, 75, 125, 55, 15, 200, -20, -60, -100, -140, 160].forEach(d => SEGS.push({ a: cpPt(d, CP_IN), b: cpPt(d, CP_OUT), w: 30, spoke: true }));
const RINGS = [{ r: CP_IN, w: 36 }, { r: CP_OUT, w: 56 }];
function segInfo(px, py, a, b) {
  const vx = b[0] - a[0], vy = b[1] - a[1], l2 = vx * vx + vy * vy;
  const t = clamp(((px - a[0]) * vx + (py - a[1]) * vy) / l2, 0, 1), cx = a[0] + vx * t, cy = a[1] + vy * t;
  return { d: Math.hypot(px - cx, py - cy), cx, cy, t };
}
const onRoad = (x, y, m = 0) => SEGS.some(s => segInfo(x, y, s.a, s.b).d < s.w / 2 + m) || RINGS.some(r => Math.abs(Math.hypot(x - CPc.x, y - CPc.y) - r.r) < r.w / 2 + m);
const COMPOUND = { x: 760, y: 1015, w: 345, h: 222 };
const ZONE = { x: 640, y: 1246, w: 470, h: 92 };
const START = { x: 1250, y: 400 };
const COP_HQ = { x: 1180, y: 1150 };
const STALLS = [{ x: 1000, y: 780 }, { x: 1280, y: 1150 }, { x: 1600, y: 1150 }, { x: 400, y: 900 }, { x: 800, y: 1520 }, { x: 1300, y: 1520 }, { x: 2000, y: 1300 }, { x: 1750, y: 620 }];
const TEMPLE = { x: 800, y: 915 };
const TENTS = [700, 810, 920, 1030].map(x => ({ x, y: 1372 }));
const SAFE_R = 70, DHARNA_T = 10;
const nearCP = (x, y) => { const d = Math.hypot(x - CPc.x, y - CPc.y); return d > 125 && d < 440 };
const blocked = (x, y, m = 0) => inRect({ x, y }, COMPOUND, m) || inRect({ x, y }, ZONE, m) || nearCP(x, y);

function seeded(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
const HOUSES = [{ x: 540, y: 1400, w: 120, h: 70, name: 'KERALA HOUSE' }];
{ const r = seeded(5); for (let i = 0; i < 500 && HOUSES.length < 18; i++) {
  const w = 80 + r() * 50, h = 56 + r() * 26, x = 20 + r() * (W - w - 40), y = 20 + r() * (H - h - 40);
  const pts = [[x, y], [x + w, y], [x, y + h], [x + w, y + h], [x + w / 2, y + h / 2]];
  if (pts.some(([px, py]) => onRoad(px, py, 26) || blocked(px, py, 40) || STALLS.some(s => Math.hypot(px - s.x, py - s.y) < 110) || Math.hypot(px - TEMPLE.x, py - TEMPLE.y) < 90)) continue;
  if (HOUSES.some(o => x < o.x + o.w + 40 && x + w + 40 > o.x && y < o.y + o.h + 40 && y + h + 40 > o.y)) continue;
  HOUSES.push({ x, y, w, h });
} }
const inHouse = (x, y, m) => HOUSES.some(o => inRect({ x, y }, o, m));
const TREES = [];
{ const r = seeded(11);
  const ok = (x, y) => x > 20 && x < W - 20 && y > 30 && y < H - 10 && !onRoad(x, y, 12) && !blocked(x, y, 24) && !inHouse(x, y, 16) && Math.hypot(x - CPc.x, y - CPc.y) > 110 &&
    !STALLS.some(s => Math.hypot(x - s.x, y - s.y) < 95) && Math.hypot(x - TEMPLE.x, y - TEMPLE.y) > 70 && !TENTS.some(t => Math.abs(x - t.x) < 60 && Math.abs(y - t.y) < 50);
  SEGS.filter(s => !s.spoke).forEach(s => {
    const vx = s.b[0] - s.a[0], vy = s.b[1] - s.a[1], len = Math.hypot(vx, vy), n = Math.floor(len / 90);
    for (let i = 0; i < n; i++) for (const side of [-1, 1]) {
      const t = (i + .5) / n, x = s.a[0] + vx * t - vy / len * side * (s.w / 2 + 26), y = s.a[1] + vy * t + vx / len * side * (s.w / 2 + 26);
      if (ok(x, y)) TREES.push({ x, y, r: 15 + r() * 6 });
    }
  });
  for (let i = 0; i < 400 && TREES.length < 260; i++) { const x = r() * W, y = r() * H; if (ok(x, y) && !TREES.some(t => Math.hypot(t.x - x, t.y - y) < 40)) TREES.push({ x, y, r: 16 + r() * 10 }) }
}

// ---------- looks ----------
const SKINS = ['#8d5a3b', '#a86b45', '#c58a5c', '#6e4329', '#b9784f', '#7c4a2c'];
const TOPS = ['#e3b23c', '#f6efd9', '#4f7a8a', '#b5432d', '#7a5c9e', '#d77a3a', '#3e6b48', '#e8d6a8', '#c45c7a'];
const BOTS = ['#3b3a36', '#f6efd9', '#5a4a3a', '#2f3f5a'];
const HAIR = ['#1f1a12', '#2a2414', '#3a2a1a'];
function randLook() {
  const t = pick(['student', 'student', 'farmer', 'farmer', 'auntie', 'uncle', 'worker']);
  const L = { skin: pick(SKINS), hair: pick(HAIR), top: pick(TOPS), bottom: pick(BOTS), hat: 'none' };
  if (t === 'student') { L.hat = Math.random() < .4 ? 'cap' : 'none'; L.hc = pick(TOPS); L.bag = true; L.bottom = '#2f3f5a' }
  if (t === 'farmer') { L.hat = 'pagdi'; L.hc = pick(['#e3b23c', '#f6efd9', '#d77a3a', '#6f9a2a', '#b5432d']); L.bottom = CREAM; L.mus = Math.random() < .7; L.top = pick(['#f6efd9', '#e8d6a8', '#4f7a8a']) }
  if (t === 'auntie') { L.hat = 'dupatta'; L.hc = pick(['#b5432d', '#7a5c9e', '#e3b23c', '#d77a3a', '#c45c7a']); L.skirt = true; L.bottom = pick(['#7a5c9e', '#3e6b48', '#b5432d', '#e3b23c']) }
  if (t === 'uncle') { L.hat = 'topi'; L.top = CREAM; L.bottom = CREAM; L.mus = true; L.hair = '#8a8a8a' }
  if (t === 'worker') { L.hat = 'band'; L.hc = '#b5432d' }
  return L;
}
const LEADER = { skin: '#a86b45', hair: '#1f1a12', top: '#5b6b2e', bottom: CREAM, hat: 'band', hc: '#e3b23c' };
const SHO = { skin: '#8d5a3b', hair: '#1f1a12', top: '#a88a4c', bottom: '#8a7444', hat: 'police', mus: true, belt: true };
const copLook = () => ({ skin: pick(SKINS), hair: '#1f1a12', top: '#b8a06a', bottom: '#9c8455', hat: 'police', mus: true, belt: true });
const SIGNS = ['ZINDABAD', 'INQUILAB!', 'HUM DEKHENGE', 'HAQ DO', 'JAWAB DO', 'CHALO JM', 'BAS KARO', 'AWAAZ DO'];
const SLOGANS = ['Inquilab Zindabad!', 'Hum dekhenge!', 'Chalo Jantar Mantar!', 'Awaaz do!', 'Haq hamara!', 'Zindabad!', 'Jawab do!'];
const JOIN = ['Main bhi chalunga!', 'Ruko, aa rahi hoon!', 'Chalo!', 'Saath hain!', 'Chai baad mein!'];
const COP_LINES = ['Ruko!', 'Chalo, hatao!', 'Permission hai?', 'Section 144!', 'Oye!'];
const CAUGHT = ['Arre yaar!', 'Chhodo!', 'Phir milenge!', 'Bus mein?!'];
const FLAGS = ['#e3b23c', '#b5432d', '#6f9a2a', '#f6efd9'];

// ---------- drawing ----------
function rr(x, y, w, h, r) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h) }
function line(x1, y1, x2, y2) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke() }
function circ(x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU) }
function limb(x1, y1, x2, y2, col, skin) {
  c.strokeStyle = INK; c.lineWidth = 5.5; line(x1, y1, x2, y2);
  c.strokeStyle = col; c.lineWidth = 3.2; line(x1, y1, x2, y2);
  c.fillStyle = skin; circ(x2, y2, 2.5); c.fill();
}
function leg(x1, y1, x2, y2, col) {
  c.strokeStyle = INK; c.lineWidth = 6; line(x1, y1, x2, y2);
  c.strokeStyle = col; c.lineWidth = 3.6; line(x1, y1, x2, y2);
  c.fillStyle = INK; c.beginPath(); c.ellipse(x2 + 1, y2, 3, 1.7, 0, 0, TAU); c.fill();
}
function hat(L, x, hy, f, s) {
  c.lineWidth = 2; c.strokeStyle = INK;
  if (L.hat === 'pagdi') {
    c.fillStyle = L.hc; c.beginPath(); c.ellipse(x, hy - 4.5, 9.5, 5.5, 0, 0, TAU); c.fill(); c.stroke();
    c.beginPath(); c.ellipse(x - f * 2, hy - 8.5, 5.5, 3.6, 0, 0, TAU); c.fill(); c.stroke();
    c.lineWidth = 1.2; c.beginPath(); c.moveTo(x - 8, hy - 2.5); c.quadraticCurveTo(x, hy - 8, x + 8, hy - 5); c.stroke();
  } else if (L.hat === 'topi') {
    c.fillStyle = CREAM; c.beginPath(); c.moveTo(x - 7.5, hy - 4); c.lineTo(x + 7.5, hy - 4); c.lineTo(x + 5, hy - 10); c.lineTo(x - 5, hy - 10); c.closePath(); c.fill(); c.stroke();
  } else if (L.hat === 'police') {
    c.fillStyle = '#b8a06a'; c.beginPath(); c.ellipse(x, hy - 8.5, 9, 3.8, 0, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = '#b5432d'; c.fillRect(x - 7.5, hy - 7.5, 15, 3.8); c.lineWidth = 1.5; c.strokeRect(x - 7.5, hy - 7.5, 15, 3.8);
    c.lineWidth = 3; line(x + f * 2, hy - 3.5, x + f * 11, hy - 2.5);
  } else if (L.hat === 'cap') {
    c.fillStyle = L.hc; c.beginPath(); c.arc(x, hy - 1, 8, Math.PI, TAU); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = L.hc; c.lineWidth = 3; line(x + f * 4, hy - 1.5, x + f * 12, hy - 1);
  } else if (L.hat === 'band') {
    c.fillStyle = L.hc; c.fillRect(x - 7.5, hy - 5, 15, 3.2);
    c.strokeStyle = L.hc; c.lineWidth = 2.2; line(x - f * 7, hy - 4, x - f * 14, hy - 1 + s * 2); line(x - f * 7, hy - 3, x - f * 12, hy + 3 + s * 2);
  } else if (L.hat === 'dupatta') {
    c.strokeStyle = INK; c.lineWidth = 7; c.beginPath(); c.arc(x, hy, 9, Math.PI * .85, Math.PI * 2.15); c.stroke();
    c.strokeStyle = L.hc; c.lineWidth = 4.5; c.beginPath(); c.arc(x, hy, 9, Math.PI * .85, Math.PI * 2.15); c.stroke();
    c.lineWidth = 4.5; line(x - f * 8, hy + 4, x - f * 10 + s, hy + 22);
  }
}
function item(kind, hx, hy, f, s, o) {
  if (kind === 'placard') {
    c.strokeStyle = '#6b4423'; c.lineWidth = 2.6; line(hx, hy + 3, hx, hy - 27);
    const bx = hx + f * 2, by = hy - 34;
    c.fillStyle = CREAM; rr(bx - 17, by - 8, 34, 15, 2); c.fill(); c.strokeStyle = INK; c.lineWidth = 2; c.stroke();
    c.fillStyle = o.sc || '#b5432d'; c.font = '700 7.5px Hind, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(o.sign || 'ZINDABAD', bx, by, 30);
  } else if (kind === 'flag') {
    const top = hy - 32; c.strokeStyle = '#6b4423'; c.lineWidth = 2.6; line(hx, hy + 3, hx, top);
    c.fillStyle = o.fc || '#e3b23c'; c.beginPath(); c.moveTo(hx, top); c.lineTo(hx + f * 18, top + 2 + s * 1.5); c.lineTo(hx + f * 18, top + 12 + s * 1.5); c.lineTo(hx, top + 11); c.closePath();
    c.fill(); c.strokeStyle = INK; c.lineWidth = 2; c.stroke();
  } else if (kind === 'megaphone') {
    c.fillStyle = '#e3b23c'; c.beginPath(); c.moveTo(hx - f * 2, hy - 2); c.lineTo(hx + f * 12, hy - 8); c.lineTo(hx + f * 12, hy + 5); c.lineTo(hx - f * 2, hy + 2); c.closePath();
    c.fill(); c.strokeStyle = INK; c.lineWidth = 2; c.stroke();
  } else if (kind === 'lathi') {
    c.strokeStyle = INK; c.lineWidth = 4.5; line(hx - f * 3, hy + 9, hx + f * 9, hy - 17);
    c.strokeStyle = '#8a5a2b'; c.lineWidth = 2.6; line(hx - f * 3, hy + 9, hx + f * 9, hy - 17);
  }
}
function person(e, L, o = {}) {
  const x = e.x + (o.jit || 0), y = e.y, f = e.face || 1, s = e.moving ? Math.sin(e.phase) : 0, sit = o.sit;
  c.lineCap = 'round'; c.lineJoin = 'round';

    const d = dist(b, LD);
    if (b.st === 'coming' && b.cool <= 0) { tx = LD.x; ty = LD.y; spd = 135; if (d > 420) b.st = 'idle' }
    else { b.t -= dt; if (b.t <= 0) { b.t = rand(2, 5); const nx = clamp(b.x + rand(-70, 70), 40, W - 40), ny = clamp(b.y + rand(-70, 70), 40, H - 40); if (!blocked(nx, ny, 10)) { b.wx = nx; b.wy = ny } } }
    const ddx = tx - b.x, ddy = ty - b.y, dd = Math.hypot(ddx, ddy);
    b.moving = dd > 3;
    if (b.moving) { const mv = Math.min(dd, spd * dt); b.x += ddx / dd * mv; b.y += ddy / dd * mv; b.phase += dt * (spd > 60 ? 12 : 6); if (Math.abs(ddx) > .5) b.face = ddx > 0 ? 1 : -1 }
    if (d < 22 && b.cool <= 0 && !G.st) {
      B.splice(i, 1);
      const f = { L: b.L, x: b.x, y: b.y, face: b.face, phase: b.phase, moving: false, item: Math.random() < .65 ? 'placard' : 'flag', sign: pick(SIGNS), fc: pick(FLAGS), sc: pick(['#b5432d', '#3e4a1d', '#8a5a2b']), say: null };
      say(f, pick(JOIN), 1.4); F.push(f); if (!police || dist(LD, K[0]) < 500) sfx.join();
    }
  }

  // police
  const cs = police ? 110 + 5 * r : 118 + 8 * r;
  K.forEach(k => {
    if (!k.pl) {
      k.cool = Math.max(0, k.cool - dt); k.alert = Math.max(0, k.alert - dt);
      const d = dist(k, LD), sight = k.alert > 0 ? 480 : 250;
      let tx = k.wx, ty = k.wy, spd = 58;
      if (k.cool > 0 || (G.st && G.st.cop === k)) { tx = k.x; ty = k.y }
      else if (G.st) { tx = LD.x + (k.x < LD.x ? -40 : 40); ty = LD.y; spd = cs }
      else if ((d < sight || (sitting && d < 900)) && !pSafe) {
        if (!k.chase) { k.chase = true; if (Math.random() < .75) say(k, pick(COP_LINES)); if (Math.random() < .4 && dist(k, ME) < 600) sfx.whistle() }
        tx = LD.x; ty = LD.y; spd = cs * (inRect(k, ZONE) ? .62 : 1);
      } else if (pSafe && d < sight) {
        const s = STALLS.reduce((a, b) => dist(LD, a) < dist(LD, b) ? a : b);
        const a = Math.atan2(k.y - s.y, k.x - s.x); tx = s.x + Math.cos(a) * (SAFE_R + 18); ty = s.y - 10 + Math.sin(a) * (SAFE_R + 18); spd = 90;
      } else {
        k.chase = false; k.t -= dt;
        if (k.t <= 0) { k.t = rand(2, 4); k.wx = clamp(k.hx + rand(-220, 220), 30, W - 30); k.wy = clamp(k.hy + rand(-220, 220), 30, H - 30) }
      }
      const ddx = tx - k.x, ddy = ty - k.y, dd = Math.hypot(ddx, ddy);
      k.moving = dd > 3;
      if (k.moving) { const mv = Math.min(dd, spd * dt); k.x += ddx / dd * mv; k.y += ddy / dd * mv; k.phase += dt * (spd > 80 ? 13 : 7); if (Math.abs(ddx) > .5) k.face = ddx > 0 ? 1 : -1 }
      k.x = clamp(k.x, 14, W - 14); k.y = clamp(k.y, 20, H - 10);
    }
    STALLS.forEach(s => { const sx = k.x - s.x, sy = k.y - (s.y - 10), sd = Math.hypot(sx, sy); if (sd < SAFE_R + 6 && sd > .01) { k.x = s.x + sx / sd * (SAFE_R + 6); k.y = s.y - 10 + sy / sd * (SAFE_R + 6) } });
    if (k.cool > 0 || G.st || G.state !== 'play') return;
    if (dist(k, LD) < 24 && LD.inv <= 0 && !pSafe) { startStruggle(k); return }
    for (let i = F.length - 1; i >= 0; i--) {
      if (dist(k, F[i]) < 18 && !inStall(F[i])) { release(F.splice(i, 1)[0], k); k.cool = k.pl ? .5 : 1.1; say(k, 'Bus mein baitho!', 1.2); if (dist(k, ME) < 500) sfx.hit(); break }
    }
  });
  for (let i = 0; i < K.length; i++) for (let j = i + 1; j < K.length; j++) {
    const a = K[i], b = K[j], dx2 = b.x - a.x, dy2 = b.y - a.y, d = Math.hypot(dx2, dy2);
    if (d < 22 && d > .01) { const p = (22 - d) / 2; if (!a.pl) { a.x -= dx2 / d * p; a.y -= dy2 / d * p } if (!b.pl) { b.x += dx2 / d * p; b.y += dy2 / d * p } }
  }
  if (G.state !== 'play') return;

  // dharna & clocks
  if (sitting && !G.st) { dharna += dt; if (dharna >= DHARNA_T) { endRound(G.mode === 'protest'); return } }
  else if (!sitting) dharna = Math.max(0, dharna - dt * 2);
  if (police) { G.timeLeft -= dt; if (G.timeLeft <= 0) { G.timeLeft = 0; endRound(true); return } }
  [LD, ...F, ...B, ...K].forEach(e => { if (e.say && (e.say.t -= dt) <= 0) e.say = null });
}

// ---------- render ----------
let dpr = 1, vw = 0, vh = 0;
function resize() { const r = cv.getBoundingClientRect(); dpr = Math.min(2, devicePixelRatio || 1); vw = r.width; vh = r.height; cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr) }
addEventListener('resize', resize);
function render() {
  const z = Math.max(.6, Math.min(1.3, Math.min(vw / 920, vh / 580)));
  const viewW = vw / z, viewH = vh / z, focus = ME;
  const camX = viewW >= W ? (W - viewW) / 2 : clamp(focus.x - viewW / 2, 0, W - viewW);
  const camY = viewH >= H ? (H - viewH) / 2 : clamp(focus.y - 20 - viewH / 2, 0, H - viewH);
  const sx = G.shake ? rand(-5, 5) : 0, sy = G.shake ? rand(-5, 5) : 0;
  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.fillStyle = INK; c.fillRect(0, 0, vw, vh);
  c.setTransform(dpr * z, 0, 0, dpr * z, (-camX * z + sx) * dpr, (-camY * z + sy) * dpr);
  c.drawImage(ground, 0, 0);
  const vis = e => e.x > camX - 120 && e.x < camX + viewW + 120 && e.y > camY - 40 && e.y < camY + viewH + 160;
  const D = [];
  TREES.forEach(t => vis(t) && D.push([t.y, () => tree(t)]));
  STALLS.forEach(s => vis(s) && D.push([s.y, () => stall(s, G.t)]));
  TENTS.forEach(t => vis(t) && D.push([t.y, () => tent(t)]));
  BAR.forEach(b => D.push([Math.max(b.a.y, b.b.y), () => barricade(b)]));
  D.push([1205, monument]); D.push([TEMPLE.y, temple]);
  const sit = leaderSitting();
  const jit = G.st ? Math.sin(G.t * 45) * 1.8 : 0;
  B.forEach(b => vis(b) && D.push([b.y, () => person(b, b.L)]));
  F.forEach(f => vis(f) && D.push([f.y, () => person(f, f.L, { item: f.item, sign: f.sign, fc: f.fc, sc: f.sc, sit: f.sit })]));
  K.forEach(k => vis(k) && D.push([k.y, () => {
    const grabbing = G.st && G.st.cop === k;
    if (grabbing) k.face = LD.x > k.x ? 1 : -1;
    c.globalAlpha = k.cool > 0 && !k.pl && !grabbing ? .75 : 1;
    person(k, k.L, { item: 'lathi', grab: grabbing, jit: grabbing ? -jit : 0 });
    c.globalAlpha = 1;
    if (k.pl) marker(k.x, k.y, '#b5432d');
    else if (k.chase && k.cool <= 0 && !G.st) { c.fillStyle = '#b5432d'; c.font = '16px Bungee, Impact, sans-serif'; c.textAlign = 'center'; c.fillText('!', k.x, k.y - 52) }
  }]));
  D.push([LD.y, () => {
    c.globalAlpha = LD.inv > 0 && (LD.inv * 10 | 0) % 2 ? .45 : 1;
    person(LD, LEADER, { item: 'megaphone', sit: sit && !LD.moving, jit });
    c.globalAlpha = 1;
    marker(LD.x, LD.y - (G.st ? 14 : 0), '#e3b23c');
  }]);
  D.sort((a, b) => a[0] - b[0]).forEach(d => d[1]());
  if (ring) { c.strokeStyle = 'rgba(' + ring.col + ',' + (1 - ring.t / .45) + ')'; c.lineWidth = 5; circ(ring.x, ring.y - 20, 30 + ring.t / .45 * ring.r); c.stroke() }
  if (dharna > 0 && !G.st) {
    c.strokeStyle = INK; c.lineWidth = 9; circ(LD.x, LD.y - 22, 30); c.stroke();
    c.strokeStyle = '#e3b23c'; c.lineWidth = 5; c.beginPath(); c.arc(LD.x, LD.y - 22, 30, -Math.PI / 2, -Math.PI / 2 + TAU * dharna / DHARNA_T); c.stroke();
  }
  if (G.st) {
    const bw = 110, bx = LD.x - bw / 2, by = LD.y - 96, m = G.st.m / 100;
    c.fillStyle = '#8a5a2b'; rr(bx, by, bw, 14, 7); c.fill();
    c.save(); rr(bx, by, bw, 14, 7); c.clip(); c.fillStyle = '#6f9a2a'; c.fillRect(bx, by, bw * m, 14); c.restore();
    c.strokeStyle = INK; c.lineWidth = 3; rr(bx, by, bw, 14, 7); c.stroke();
    c.lineWidth = 2; line(bx + bw / 2, by - 3, bx + bw / 2, by + 17);
  }
  [...B, ...K, ...F, LD].forEach(e => { if (e.say && vis(e)) bubble(e.x, e.y - (e.item === 'placard' || e.item === 'flag' ? 82 : (e === LD ? 72 : 62)), e.say.text) });

  // screen space
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const hud = document.querySelector('.hud').getBoundingClientRect();
  const mw = Math.min(170, vw * .3), mh = mw * H / W, mx = vw - mw - 14, my = hud.bottom + 10, ms = mw / W;
  c.fillStyle = 'rgba(246,239,217,.94)'; rr(mx, my, mw, mh, 8); c.fill(); c.strokeStyle = INK; c.lineWidth = 3; c.stroke();
  c.save(); rr(mx, my, mw, mh, 8); c.clip();
  c.strokeStyle = '#b9ad88'; c.lineCap = 'round';
  SEGS.forEach(s => { c.lineWidth = Math.max(1.5, s.w * ms); c.beginPath(); c.moveTo(mx + s.a[0] * ms, my + s.a[1] * ms); c.lineTo(mx + s.b[0] * ms, my + s.b[1] * ms); c.stroke() });
  RINGS.forEach(rg => { c.lineWidth = Math.max(1.5, rg.w * ms); c.beginPath(); c.arc(mx + CPc.x * ms, my + CPc.y * ms, rg.r * ms, 0, TAU); c.stroke() });
  c.fillStyle = '#c8694a'; c.fillRect(mx + COMPOUND.x * ms, my + COMPOUND.y * ms, COMPOUND.w * ms, COMPOUND.h * ms);
  c.fillStyle = '#e3b23c'; c.fillRect(mx + ZONE.x * ms, my + ZONE.y * ms, ZONE.w * ms, ZONE.h * ms);
  c.fillStyle = '#6f9a2a'; STALLS.forEach(s => { circ(mx + s.x * ms, my + s.y * ms, 2.5); c.fill() });
  c.fillStyle = '#5b6b2e'; F.forEach(f => c.fillRect(mx + f.x * ms - 1, my + f.y * ms - 1, 2, 2));
  K.forEach(k => { c.fillStyle = k.pl ? '#b5432d' : '#8a5a2b'; const s = k.pl ? 6 : 4; c.fillRect(mx + k.x * ms - s / 2, my + k.y * ms - s / 2, s, s) });
  c.fillStyle = '#e3b23c'; c.strokeStyle = INK; c.lineWidth = 1.5; circ(mx + LD.x * ms, my + LD.y * ms, 4); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(38,45,18,.6)'; c.lineWidth = 1; c.strokeRect(mx + camX * ms, my + camY * ms, viewW * ms, viewH * ms);
  c.restore();
  // off-screen pointer to the leader (police) or to Jantar Mantar (protest)
  const tgt = G.mode === 'police' ? { x: LD.x, y: LD.y - 20, l: 'LEADER' } : { x: ZONE.x + ZONE.w / 2, y: ZONE.y + ZONE.h / 2, l: 'JM' };
  const tx = (tgt.x - camX) * z, ty = (tgt.y - camY) * z;
  if (G.state === 'play' && (tx < 0 || tx > vw || ty < hud.bottom || ty > vh)) {
    const cx0 = vw / 2, cy0 = (hud.bottom + vh) / 2, a = Math.atan2(ty - cy0, tx - cx0);
    const ex = clamp(cx0 + Math.cos(a) * vw, 40, vw - 40), ey = clamp(cy0 + Math.sin(a) * vh, hud.bottom + 30, vh - 40);
    c.save(); c.translate(ex, ey); c.rotate(a); c.fillStyle = '#e3b23c'; c.strokeStyle = INK; c.lineWidth = 3;
    c.beginPath(); c.moveTo(18, 0); c.lineTo(-10, -13); c.lineTo(-4, 0); c.lineTo(-10, 13); c.closePath(); c.fill(); c.stroke(); c.restore();
    c.font = '12px Bungee, Impact, sans-serif'; c.textAlign = 'center'; c.lineWidth = 4; c.strokeStyle = INK; c.strokeText(tgt.l, ex, ey + 30); c.fillStyle = CREAM; c.fillText(tgt.l, ex, ey + 30);
  }
  const bigText = (t, y, size, col) => { c.font = size + 'px Bungee, Impact, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineWidth = 6; c.strokeStyle = INK; c.lineJoin = 'round'; c.strokeText(t, vw / 2, y); c.fillStyle = col; c.fillText(t, vw / 2, y) };
  if (G.st) {
    const you = playerInStruggle();
    bigText(you ? (coarse ? 'TAP TAP TAP!' : 'MASH SPACE!') : 'CONSTABLE HAS HIM!', hud.bottom + 46, Math.min(34, vw / 12), '#e3b23c');
    c.font = '700 15px Hind, sans-serif'; c.lineWidth = 4; c.strokeText(`Kafila pull +${G.st.kafila | 0}   ·   Police backup −${G.st.helpers | 0}`, vw / 2, hud.bottom + 78);
    c.fillStyle = CREAM; c.fillText(`Kafila pull +${G.st.kafila | 0}   ·   Police backup −${G.st.helpers | 0}`, vw / 2, hud.bottom + 78);
  } else if (G.banner) bigText(G.banner.text, hud.bottom + 50, Math.min(28, vw / 16), CREAM);
  if (joy) {
    c.strokeStyle = 'rgba(246,239,217,.8)'; c.lineWidth = 3; circ(joy.ox, joy.oy, 50); c.stroke();
    const jx = joy.x - joy.ox, jy = joy.y - joy.oy, l = Math.hypot(jx, jy), k = l > 50 ? 50 / l : 1;
    c.fillStyle = 'rgba(227,178,60,.9)'; circ(joy.ox + jx * k, joy.oy + jy * k, 20); c.fill(); c.strokeStyle = INK; c.stroke();
  }
}

// ---------- HUD ----------
const hudCache = {};
function setText(id, t) { if (hudCache[id] !== t) { hudCache[id] = t; $(id).textContent = t } }
function hudUpdate() {
  const police = G.mode === 'police';
  setText('hRound', (police ? 'Police · R' : 'Round ') + G.round);
  setText('hKafila', (police ? 'Their kafila ' : 'Kafila ') + F.length + '/' + need);
  if (police) { const s = Math.ceil(G.timeLeft); setText('hThird', 'Time ' + (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0')) }
  else setText('hThird', 'Chances ' + '●'.repeat(Math.max(0, G.chances)) + '○'.repeat(3 - Math.max(0, G.chances)));
  $('hStam').style.width = ME.stam + '%';
  const inZone = inRect(LD, ZONE), sitting = leaderSitting(), st = $('hStatus');
  let s, cls = '';
  if (G.st) { s = playerInStruggle() ? (police ? 'Mash Space! Hold him!' : 'Mash Space! Break free!') : 'Constable grabbed the leader'; cls = 'alarm' }
  else if (police) {
    if (sitting) { s = 'Dharna on! ' + Math.max(0, DHARNA_T - dharna).toFixed(1) + 's. Grab the leader!'; cls = 'alarm' }
    else if (F.length >= need) { s = 'Kafila ready, heading to Jantar Mantar'; cls = 'hot' }
    else if (inStall(LD)) s = 'Leader hiding at a chai stall';
    else s = 'Grab the leader (yellow marker)';
  } else {
    if (sitting) { s = 'Dharna on! ' + Math.max(0, DHARNA_T - dharna).toFixed(1) + 's to go'; cls = 'hot' }
    else if (inZone) s = 'Need ' + (need - F.length) + ' more to sit';
    else if (F.length < need) s = 'Recruit ' + (need - F.length) + ' more';
    else s = 'Kafila ready! Down Sansad Marg to Jantar Mantar';
    if (inStall(LD) && !sitting) s = 'Chai break. Police can\'t enter';
  }
  setText('hStatus', s); st.className = 'chip status' + (cls ? ' ' + cls : '');
  const bA = $('bA'), lab = G.st && playerInStruggle() ? 'ZOR!' : (police ? 'SEETI' : 'NARA!');
  if (bA.textContent !== lab) bA.textContent = lab;
}

// ---------- loop ----------
let last = performance.now();
function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  if (G.state === 'play') step(dt); else G.t += dt;
  render(); hudUpdate();
  requestAnimationFrame(frame);
}
resize(); buildGround(); menu();
if (document.fonts) document.fonts.ready.then(buildGround);
requestAnimationFrame(frame);
})();
</script>
</body>
